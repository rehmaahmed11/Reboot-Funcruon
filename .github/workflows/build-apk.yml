name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-apk:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare APK artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RebootMenu-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/RebootMenu-release.apk
          ls -lh dist/

          {
            echo "## Generated APK Files"
            echo ""
            echo "| Variant | File | Size | SHA-256 |"
            echo "| --- | --- | --- | --- |"
            for apk in dist/*.apk; do
              name=$(basename "$apk")
              variant=$(echo "$name" | sed -E 's/RebootMenu-(.*)\.apk/\1/')
              size=$(du -h "$apk" | cut -f1)
              sha=$(sha256sum "$apk" | cut -d' ' -f1)
              echo "| \`$variant\` | \`$name\` | $size | \`$sha\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: RebootMenu-debug-apk
          path: dist/RebootMenu-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: RebootMenu-release-apk
          path: dist/RebootMenu-release-apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK Release on Merge to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/RebootMenu-release.apk dist/RebootMenu-debug.apk --clobber
          else
            gh release create "$TAG" \
              dist/RebootMenu-release.apk \
              dist/RebootMenu-debug.apk \
              --title "Reboot Menu APK (Build #${GITHUB_RUN_NUMBER})" \
              --notes "Automated APK build generated from commit \`${GITHUB_SHA}\` on \`main\`." \
              --generate-notes
          fi
