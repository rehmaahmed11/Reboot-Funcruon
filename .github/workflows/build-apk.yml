name: Build Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-apk:
    name: Generate APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug and Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare APK artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/RebootMenu-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/RebootMenu-release.apk
          ls -lh dist/

          {
            echo "## Generated APK Files"
            echo ""
            echo "| Variant | File | Size | SHA-256 |"
            echo "| --- | --- | --- | --- |"
            for apk in dist/*.apk; do
              name=$(basename "$apk")
              variant=$(echo "$name" | sed -E 's/RebootMenu-(.*)\.apk/\1/')
              size=$(du -h "$apk" | cut -f1)
              sha=$(sha256sum "$apk" | cut -d' ' -f1)
              echo "| \`$variant\` | \`$name\` | $size | \`$sha\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RebootMenu-debug-apk
          path: dist/RebootMenu-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: RebootMenu-release-apk
          path: dist/RebootMenu-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK Release on Merge to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Reboot Menu APK (Build #${{ github.run_number }})
          body: |
            Automated APK build generated from commit `${{ github.sha }}` on `main`.

            ### Included Files
            - **`RebootMenu-release.apk`** — Signed release APK ready to install on Android devices.
            - **`RebootMenu-debug.apk`** — Debug-signed APK.
          files: |
            dist/RebootMenu-release.apk
            dist/RebootMenu-debug.apk
          generate_release_notes: true
